name: Deploy to VPS

on:
  push:
    branches: [deployment]

permissions:
  statuses: write

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/vdcd-backend

jobs:
  # ─── Step 1: CI — Lint, Test, Build check ───────────────────
  ci:
    name: CI — Lint → Test → Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vdcd_test
          POSTGRES_USER: vdcd_user
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: vdcd_test
          DB_USER: vdcd_user
          DB_PASSWORD: testpass
          JWT_SECRET: ci-test-jwt-secret-key-not-real
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-key-not-real

      - name: Build
        run: pnpm build

  # ─── Step 2: Build Docker image & push to registry ─────────
  docker:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Step 3: Deploy to VPS via SSH ─────────────────────────
  deploy:
    name: Deploy to VPS
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          envs: DOCKER_USER,DOCKER_PASS
          script: |
            set -e

            DEPLOY_DIR="/opt/vdcd"
            IMAGE="${{ env.IMAGE_NAME }}"
            NEW_TAG="${{ github.sha }}"
            SHORT_SHA=$(echo "$NEW_TAG" | cut -c1-7)

            echo "[DEPLOY] VDCD Backend — commit $SHORT_SHA"

            cd "$DEPLOY_DIR"

            # Docker login
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

            # Save current image tag for rollback
            CURRENT_TAG=$(docker inspect --format='{{.Config.Image}}' vdcd-backend 2>/dev/null | awk -F: '{print $2}') || CURRENT_TAG="latest"
            echo "$CURRENT_TAG" > .last-deployed-tag

            # Pull new image
            echo "[PULL] Image: $IMAGE:$SHORT_SHA"
            docker pull "$IMAGE:$SHORT_SHA"

            # Update .env with new image tag and Docker image name
            grep -q '^IMAGE_TAG=' .env && sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$SHORT_SHA|" .env || echo "IMAGE_TAG=$SHORT_SHA" >> .env
            grep -q '^DOCKER_IMAGE=' .env && sed -i "s|^DOCKER_IMAGE=.*|DOCKER_IMAGE=$IMAGE|" .env || echo "DOCKER_IMAGE=$IMAGE" >> .env

            # Deploy with zero-downtime
            echo "[START] Starting new container..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate backend

            # Wait for health check
            echo "[HEALTH] Waiting for health check..."
            MAX_RETRIES=15
            RETRY_INTERVAL=4
            for i in $(seq 1 $MAX_RETRIES); do
              if curl -sf http://localhost:3001/api/v1/health > /dev/null 2>&1; then
                echo "[OK] Health check passed (attempt $i/$MAX_RETRIES)"
                break
              fi
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "[FAIL] Health check failed after $MAX_RETRIES attempts"
                echo "[ROLLBACK] Rolling back to previous version: $CURRENT_TAG"
                sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$CURRENT_TAG|" .env
                docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate backend
                echo "[HEALTH] Waiting for rollback health check..."
                sleep 10
                if curl -sf http://localhost:3001/api/v1/health > /dev/null 2>&1; then
                  echo "[OK] Rollback successful"
                else
                  echo "[CRITICAL] Rollback also failed — manual intervention required!"
                fi
                exit 1
              fi
              echo "  Attempt $i/$MAX_RETRIES — retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            done

            # Cleanup old images
            echo "[CLEANUP] Cleaning up old images..."
            docker image prune -f --filter "until=48h"

            echo "[DONE] Deploy complete — $SHORT_SHA is live!"

      - name: Notify deploy result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '[OK]' : '[FAIL]';
            const sha = context.sha.substring(0, 7);
            const message = `${status} **VPS Deploy** — \`${sha}\` — ${new Date().toISOString()}`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              description: `Deploy ${'${{ job.status }}' === 'success' ? 'succeeded' : 'failed'}`,
              context: 'deploy/vps'
            });
